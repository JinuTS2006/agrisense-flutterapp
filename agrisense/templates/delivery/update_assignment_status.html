{% extends "base.html" %}

{% block content %}
<h2>Update Assignment Status - Assignment #{{ assignment.id }}</h2>

<form method="post">
    {% csrf_token %}
    <label>Status:</label>
    <select name="status">
        {% for value, display in status_choices %}
        <option value="{{ value }}" {% if assignment.status == value %}selected{% endif %}>
            {{ display }}
        </option>
        {% endfor %}
    </select>
    <button type="submit">Update</button>
</form>

<a href="{% url 'delivery:view_assignments' %}">Back to Assignments</a>
{% endblock %}
