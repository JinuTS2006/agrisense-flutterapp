{% extends "base.html" %}

{% block content %}
<h2>All Users</h2>
<table border="1" cellpadding="8" cellspacing="0">
    <thead>
        <tr>
            <th>ID</th>
            <th>Username</th>
            <th>Email</th>
            <th>Role</th>
            <th>Date Joined</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for user in users %}
        <tr>
            <td>{{ user.id }}</td>
            <td>{{ user.username }}</td>
            <td>{{ user.email }}</td>
            <td>{{ user.role }}</td>
            <td>{{ user.date_joined|date:"Y-m-d" }}</td>
            <td>
                <a href="{% url 'admin:edit_user' user.id %}">Edit</a> |
                <a href="{% url 'admin:delete_user' user.id %}">Delete</a>
            </td>
        </tr>
        {% empty %}
        <tr><td colspan="6">No users found.</td></tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
