{% extends "base.html" %}

{% block content %}
<h2>Update Order Status - Order #{{ order.id }}</h2>

<form method="post">
    {% csrf_token %}
    <label>Status:</label>
    <select name="status">
        {% for value, display in status_choices %}
        <option value="{{ value }}" {% if order.status == value %}selected{% endif %}>{{ display }}</option>
        {% endfor %}
    </select>
    <button type="submit">Update</button>
</form>

<a href="{% url 'farmer:farmer_orders' %}">Back to Orders</a>
{% endblock %}
