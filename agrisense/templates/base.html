<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AgriSense - Smart Agriculture</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f4;
        }
        header {
            background-color: #4caf50;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 1.5em;
            margin-bottom: 20px;
        }
        form div {
            margin-bottom: 10px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 3px;
        }
        input[type="text"], input[type="number"] {
            padding: 5px;
            width: 250px;
        }
        button {
            padding: 8px 15px;
            background-color: #4caf50;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        .messages {
            color: red;
            margin-bottom: 15px;
        }
        h2, h3 {
            color: #333;
        }
    </style>
</head>
<body>
    <header>
        AgriSense - Smart Agriculture Platform
    </header>

    {% if messages %}
    <div class="messages">
        {% for message in messages %}
            <p>{{ message }}</p>
        {% endfor %}
    </div>
    {% endif %}

    {% block content %}
    <!-- Page-specific content goes here -->
    {% endblock %}
</body>
</html>
